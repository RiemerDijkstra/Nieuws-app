name: Nieuws ophalen en publiceren

on:
  schedule:
    - cron: '17 */3 * * *'
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Node.js installeren
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Onderdelen installeren
        run: npm ci

      - name: Pages voorbereiden
        id: pages
        uses: actions/configure-pages@v5

      - name: Nieuws ophalen (paywalls eruit, plaats en urgentie bepalen)
        run: npm run fetch
        env:
          PREVIOUS_NEWS_URL: ${{ steps.pages.outputs.base_url }}/data/news.json

      - name: Website samenstellen
        run: |
          mkdir -p _site
          cp -r index.html favicon.svg assets data _site/

      - name: Website uploaden
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publiceren op GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
